kind: Pod
apiVersion: v1
metadata:
  name: pod-oom
spec:
  containers:
    - name: pod-oom-container
      image: polinux/stress
      ports:
        - containerPort: 80
      resources:
        limits:
          memory: "100Mi"
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]


