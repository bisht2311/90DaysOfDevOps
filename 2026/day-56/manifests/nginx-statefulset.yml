apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-statefulset
spec:
  selector:
    matchLabels:
      app: nginx-stateful
  serviceName: nginx-headless-svc 
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx-stateful
    spec:
      containers:
      - name: nginx-statefulset-container
        image: registry.k8s.io/nginx-slim:0.24
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-stateful-vol
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: nginx-stateful-vol
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Mi
